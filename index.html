<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sone Moe - Portfolio</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;600&family=Noto+Sans+JP:wght@300;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #3498db;
            --bg-color: #f8f9fa;
            --text-color: #333;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', 'Noto Sans JP', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background: white;
            width: 100%;
            max-width: 500px;
            border-radius: 24px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.05);
            overflow: hidden;
            text-align: center;
            padding-bottom: 40px;
            transition: transform 0.3s ease;
        }

        .container:hover {
            transform: translateY(-5px);
        }

        /* 写真を表示する場所 */
        .header-image {
            width: 100%;
            height: 250px;
            background: #e0e0e0;
            background-image: url('https://images.unsplash.com/photo-1488646953014-85cb44e25828?auto=format&fit=crop&w=800&q=80'); /* 旅をイメージしたサンプル画像 */
            background-size: cover;
            background-position: center;
            position: relative;
        }

        /* 自分の写真を後で入れるためのスペース（丸い枠） */
        .profile-img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 5px solid white;
            background: #bdc3c7;
            margin-top: -60px;
            position: relative;
            display: inline-block;
            background-image: url('yamatojibun.jpg'); /* ここに自分の写真を設定可能 */
            background-size: cover;
        }

        .content {
            padding: 20px 30px;
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 10px;
            color: var(--primary-color);
            letter-spacing: 0.05em;
        }

        .tag {
            display: inline-block;
            background: #e1f5fe;
            color: var(--accent-color);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            margin-bottom: 20px;
            font-weight: 600;
        }

        .section {
            margin-bottom: 25px;
            text-align: left;
        }

        .section-title {
            font-size: 0.9rem;
            font-weight: 600;
            color: #95a5a6;
            text-transform: uppercase;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
        }

        .section-title::after {
            content: "";
            flex: 1;
            height: 1px;
            background: #eee;
            margin-left: 10px;
        }

        .text {
            font-size: 1rem;
            color: var(--text-color);
            font-weight: 300;
        }

        .hobby-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: flex-start; 
        }

        .hobby-item {
            background: #f1f2f6;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.9rem;
            white-space: nowrap;
            display: inline-block;
        }

        /* スマホ対応の調整 */
        @media (max-width: 480px) {
            .container {
                border-radius: 0;
                box-shadow: none;
            }
            body {
                padding: 0;
                background-color: white;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header-image"></div>
        
        <div class="profile-img"></div>

        <div class="content">
            <h1>曽根 萌</h1>
            <div class="tag">Future AI Engineer</div>

            <div class="section">
                <div class="section-title">Goal</div>
                <p class="text">
                    世界中を旅しながら働く。<br>
広い空が見える部屋で暮らす。<br>47都道府県制覇する。
                </p>
            </div>

            <div class="section">
                <div class="section-title">Hobbies</div>
                <div class="hobby-list">
                    <span class="hobby-item">✈️ 旅行（国内・海外）</span>
                    <span class="hobby-item">🎨絵画制作</span>
                    <span class="hobby-item">🤣お笑い鑑賞</span>
                    <span class="hobby-item">📕読書</span>
                    <span class="hobby-item">⛰️自然散策</span>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
